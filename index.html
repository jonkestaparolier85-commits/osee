<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salvatore Market IA</title>
    <style>
        :root {
            --red-main: #ff1e27;
            --red-dark: #800003;
            --red-glow: rgba(255, 30, 39, 0.5);
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* En-tête compact */
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--red-main);
        }

        /* Section Centrale : L'ORBE VOCALE GEANTE */
        .main-voice-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .orb-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .voice-orb {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--red-main) 0%, var(--red-dark) 100%);
            box-shadow: 0 0 35px var(--red-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 3px solid #ffffff;
        }

        .voice-orb:active {
            transform: scale(0.95);
        }

        .voice-orb.listening {
            animation: pulse-red 1.2s infinite alternate;
            background: radial-gradient(circle, #ffffff 0%, var(--red-main) 100%);
        }

        .voice-orb svg {
            width: 65px;
            height: 65px;
            fill: #ffffff;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 20px var(--red-main), 0 0 40px var(--red-main);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 50px var(--red-main), 0 0 80px var(--red-main);
                transform: scale(1.1);
            }
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ccc;
            text-align: center;
            margin-bottom: 10px;
        }

        .user-transcript {
            font-size: 0.95rem;
            color: var(--red-main);
            text-align: center;
            min-height: 24px;
            font-style: italic;
            padding: 0 20px;
        }

        /* Barre d'actions inférieure (Boutons flottants) */
        .bottom-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px 25px 20px;
            background-color: #141414;
            border-top: 1px solid #222;
        }

        .action-btn {
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .action-btn:active {
            background-color: var(--red-main);
        }

        /* Modal (Panneau caché pour ajouter / voir les produits) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: flex-end;
            flex-direction: column;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            border-top: 2px solid var(--red-main);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--red-main);
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Formulaire */
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--red-main);
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--red-main);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Liste de produits */
        .product-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Salvatore <span>Market IA</span></h1>
    </header>

    <!-- ZONE PRINCIPALE : ORBE VOCALE -->
    <main class="main-voice-section">
        <div class="orb-container">
            <div class="voice-orb" id="micBtn" onclick="startListening()">
                <!-- Icone Micro -->
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
        </div>
        <div class="status-text" id="status">Appuyez pour parler</div>
        <div class="user-transcript" id="lastQuery"></div>
    </main>

    <!-- BARRE INFERIEURE AVEC LES BOUTONS CACHES -->
    <div class="bottom-bar">
        <button class="action-btn" onclick="openModal()">
            <span>➕</span> Ajouter Produit
        </button>
        <button class="action-btn" onclick="openModal('list')">
            <span>📦</span> Stock (10)
        </button>
    </div>

    <!-- PANNEAU CACHÉ (MODAL) -->
    <div class="modal" id="modalPanel">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Enregistrer un produit</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <!-- Formulaire pour ajouter -->
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="text" id="prodName" placeholder="Nom (ex: Pain, Lait)" required>
                <input type="number" step="0.01" id="prodPrice" placeholder="Prix (ex: 2.50)" required>
                <button type="submit" class="save-btn">MÉMORISER LE PRODUIT</button>
            </form>

            <!-- Liste des produits de la base -->
            <div class="product-list" id="productList"></div>
        </div>
    </div>

    <script>
        // --- 1. BASE DE DONNÉES (10 PRODUITS PRÉ-ENREGISTRÉS) ---
        const initialProducts = [
            { name: "lait", price: 1.50 },
            { name: "pain", price: 1.20 },
            { name: "sucre", price: 2.00 },
            { name: "cafe", price: 4.50 },
            { name: "riz", price: 3.10 },
            { name: "eau", price: 0.80 },
            { name: "savon", price: 1.80 },
            { name: "huile", price: 5.00 },
            { name: "farine", price: 1.60 },
            { name: "chocolat", price: 2.30 }
        ];

        let inventory = JSON.parse(localStorage.getItem('salvatore_inventory')) || initialProducts;

        function updateProductListUI() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = '';
            inventory.forEach(p => {
                listDiv.innerHTML += `
                    <div class="product-item">
                        <span style="text-transform: capitalize;">${p.name}</span>
                        <span style="color: var(--red-main); font-weight: bold;">${p.price.toFixed(2)} $</span>
                    </div>`;
            });
            localStorage.setItem('salvatore_inventory', JSON.stringify(inventory));
        }

        function saveProduct(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value.trim().toLowerCase();
            const price = parseFloat(document.getElementById('prodPrice').value);

            if (name && !isNaN(price)) {
                const index = inventory.findIndex(p => p.name === name);
                if (index !== -1) {
                    inventory[index].price = price;
                } else {
                    inventory.push({ name, price });
                }
                updateProductListUI();
                speak(`Le produit ${name} est enregistré à ${price} dollars.`);
                document.getElementById('productForm').reset();
                closeModal();
            }
        }

        // --- 2. MODAL CACHÉE ---
        function openModal() {
            document.getElementById('modalPanel').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalPanel').style.display = 'none';
        }

        // --- 3. SYNTHÈSE VOCALE (Réponse orale) ---
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- 4. RECONNAISSANCE VOCALE (Écoute) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;

            recognition.onstart = () => {
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('status').innerText = "Salvatore vous écoute...";
            };

            recognition.onend = () => {
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('status').innerText = "Appuyez pour parler";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                document.getElementById('lastQuery').innerText = `"${transcript}"`;
                processCommand(transcript);
            };
        } else {
            alert("Votre navigateur ne supporte pas la reconnaissance vocale. Utilisez Chrome sur Android ou Safari sur iPhone.");
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                }
            }
        }

        // --- 5. INTELLIGENCE DE L'IA ---
        function processCommand(cmd) {
            // Traitement pour les prix
            if (cmd.includes("prix") || cmd.includes("combien") || cmd.includes("coûte") || cmd.includes("c'est combien")) {
                let found = false;
                for (let item of inventory) {
                    if (cmd.includes(item.name)) {
                        speak(`Le prix du ${item.name} est de ${item.price} dollars.`);
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    speak("Je n'ai pas trouvé ce produit dans le système.");
                }
            } 
            // Domotique
            else if (cmd.includes("allume") || cmd.includes("éteins") || cmd.includes("ferme") || cmd.includes("ouvre")) {
                if (cmd.includes("lumière") || cmd.includes("lumieres")) {
                    if (cmd.includes("allume")) {
                        document.body.style.backgroundColor = "#2a0808";
                        speak("Lumières de la boutique allumées.");
                    } else {
                        document.body.style.backgroundColor = "#0d0d0d";
                        speak("Lumières éteintes.");
                    }
                } else {
                    speak("Ordre domotique bien reçu.");
                }
            }
            // Bonjour
            else if (cmd.includes("bonjour") || cmd.includes("salut")) {
                speak("Bonjour ! Que puis-je faire pour la boutique ?");
            }
            else {
                speak("Désolé, je n'ai pas compris la commande.");
            }
        }

        // Initialisation
        updateProductListUI();
    </script>
</body>
</html>
