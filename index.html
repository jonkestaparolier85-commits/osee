<!DOCTYPE html>
<html lang="fr" data-theme-color="#4CAF50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAMÉLÉON - Master Edition</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.4);
            --bg-deep: #0a0a0f;
            --surface: rgba(20, 20, 30, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Toile de fond pour les particules dynamiques du Caméléon */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .app-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInDown 0.8s ease-out;
        }

        .brand-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 30px var(--primary-glow);
            transition: all 0.5s ease;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .viewfinder-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-glow);
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .viewfinder-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scanline 3s linear infinite;
        }

        .viewport {
            width: 100%;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, img, canvas#snapshot-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .reticle {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-reticle 2s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reticle::after {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .color-readout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-chip {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary);
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        .color-text span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .color-text strong {
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .action-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modules-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }

        .mod-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(320%); }
        }

        @keyframes pulse-reticle {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="app-wrapper">
        <div class="brand-header">
            <h1 id="brand-title">Caméléon</h1>
            <p>Adaptive Neural Interface</p>
        </div>

        <div class="viewfinder-card" id="card-border">
            <div class="viewport">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="snapshot-canvas" style="display:none;"></canvas>
                <img id="preview-img" style="display:none;" alt="Capture Caméléon">
                <div class="reticle"></div>
            </div>

            <div class="color-readout">
                <div class="color-info">
                    <div class="color-chip" id="color-chip"></div>
                    <div class="color-text">
                        <span>Fréquence Chromatique</span>
                        <strong id="hex-code">#4CAF50</strong>
                    </div>
                </div>
                <div id="status-badge" style="font-size:0.8rem; color:var(--primary); font-weight:bold;">EN LIGNE</div>
            </div>
        </div>

        <div class="action-stack">
            <button id="capture-btn" class="btn btn-primary">
                <span>Capturer & Adapter</span>
            </button>
            <button id="switch-cam-btn" class="btn btn-secondary">
                <span>Changer de Caméra</span>
            </button>
            <button id="proceed-btn" class="btn btn-primary" style="display:none; margin-top:5px;">
                <span>Entrer dans l'Application</span>
            </button>
        </div>

        <div class="modules-preview">
            <div class="mod-pill">🎯 Objectifs</div>
            <div class="mod-pill">💰 Finances</div>
            <div class="mod-pill">📦 Fournisseurs</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const previewImg = document.getElementById('preview-img');
        const captureBtn = document.getElementById('capture-btn');
        const switchCamBtn = document.getElementById('switch-cam-btn');
        const proceedBtn = document.getElementById('proceed-btn');
        const colorChip = document.getElementById('color-chip');
        const hexCode = document.getElementById('hex-code');
        const brandTitle = document.getElementById('brand-title');
        const cardBorder = document.getElementById('card-border');

        let useFrontCamera = false;
        let currentStream = null;
        let isCaptured = false;

        // Gestionnaire de flux vidéo robuste avec gestion des erreurs de permissions
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: {
                    facingMode: useFrontCamera ? 'user' : 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                console.warn("Caméra principale introuvable, basculement en mode standard...", err);
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = currentStream;
                } catch (e) {
                    alert("Accès à la caméra requis pour l'effet Caméléon.");
                }
            }
        }

        initCamera();

        switchCamBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        // Algorithme d'extraction de couleur dominante optimisé
        captureBtn.addEventListener('click', () => {
            if (!isCaptured) {
                snapshotCanvas.width = video.videoWidth || 640;
                snapshotCanvas.height = video.videoHeight || 480;
                const ctx = snapshotCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

                const dataURL = snapshotCanvas.toDataURL('image/png');
                previewImg.src = dataURL;
                previewImg.style.display = 'block';
                video.style.display = 'none';

                // Échantillonnage intelligent de la zone centrale
                const imgData = ctx.getImageData(
                    snapshotCanvas.width * 0.25, 
                    snapshotCanvas.height * 0.25, 
                    snapshotCanvas.width * 0.5, 
                    snapshotCanvas.height * 0.5
                ).data;

                let r = 0, g = 0, b = 0, count = 0;
                for (let i = 0; i < imgData.length; i += 16) {
                    r += imgData[i];
                    g += imgData[i + 1];
                    b += imgData[i + 2];
                    count++;
                }

                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);

                const hex = rgbToHex(r, g, b);
                applyChameleonTheme(r, g, b, hex);

                captureBtn.innerHTML = "<span>Reprendre la photo</span>";
                proceedBtn.style.display = 'flex';
                switchCamBtn.style.display = 'none';
                isCaptured = true;
            } else {
                // Réinitialisation
                previewImg.style.display = 'none';
                video.style.display = 'block';
                captureBtn.innerHTML = "<span>Capturer & Adapter</span>";
                proceedBtn.style.display = 'none';
                switchCamBtn.style.display = 'flex';
                isCaptured = false;
            }
        });

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join('').toUpperCase();
        }

        function applyChameleonTheme(r, g, b, hex) {
            const rgbString = `${r}, ${g}, ${b}`;
            const glowColor = `rgba(${rgbString}, 0.4)`;

            document.documentElement.style.setProperty('--primary', hex);
            document.documentElement.style.setProperty('--primary-glow', glowColor);
            
            colorChip.style.background = hex;
            colorChip.style.boxShadow = `0 0 15px ${hex}`;
            hexCode.textContent = hex;
            cardBorder.style.borderColor = hex;
            cardBorder.style.boxShadow = `0 20px 40px rgba(0,0,0,0.5), 0 0 25px ${glowColor}`;

            // Sauvegarde globale pour objectifs.html, finances.html, fournisseurs.html
            localStorage.setItem('cameleon_color', hex);
            localStorage.setItem('cameleon_rgb', rgbString);
        }

        proceedBtn.addEventListener('click', () => {
            // Arrêt des flux caméras avant transition
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            window.location.href = 'objectifs.html';
        });

        // Animation de particules d'arrière-plan interactives
        const pCanvas = document.getElementById('particle-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 25; i++) {
            particles.push({
                x: Math.random() * pCanvas.width,
                y: Math.random() * pCanvas.height,
                radius: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5
            });
        }

        function animateParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#4CAF50';
            pCtx.globalAlpha = 0.25;

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = pCanvas.width;
                if (p.x > pCanvas.width) p.x = 0;
                if (p.y < 0) p.y = pCanvas.height;
                if (p.y > pCanvas.height) p.y = 0;

                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
