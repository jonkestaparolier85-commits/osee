<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAMÉLÉON - Planification & Objectifs</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.4);
            --bg-deep: #0a0a0f;
            --surface: rgba(20, 20, 30, 0.85);
            --surface-card: rgba(30, 30, 45, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* En-tête Principal */
        header {
            background: linear-gradient(135deg, rgba(20,20,30,0.9), var(--surface));
            border-bottom: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Barre de navigation des périodes (Onglets) */
        .period-nav {
            display: flex;
            gap: 8px;
            padding: 15px 20px;
            overflow-x: auto;
            background: rgba(10, 10, 15, 0.5);
            scrollbar-width: none;
        }

        .period-nav::-webkit-scrollbar {
            display: none;
        }

        .period-btn {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .period-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Conteneur Global */
        .container {
            padding: 20px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Panneau de Statistiques & Progression */
        .stats-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.5s ease, background 0.5s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Formulaire d'ajout d'objectif */
        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
            backdrop-filter: blur(15px);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-field, .search-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus, .search-field:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px var(--primary-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        /* Liste des Objectifs */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .objectives-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .objective-item {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .objective-item.completed {
            opacity: 0.5;
            border-color: rgba(255,255,255,0.03);
        }

        .objective-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            word-break: break-word;
        }

        .objective-text {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .objective-item.completed .objective-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Checkbox Personnalisée */
        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }

        .objective-item.completed .custom-checkbox {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .custom-checkbox::after {
            content: '✓';
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
        }

        .objective-item.completed .custom-checkbox::after {
            display: block;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Barre de navigation inférieure fixe (Bottom Navigation) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 12, 18, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">Objectif du Jour</h1>
        <p>Caméléon Engine - Stratégie & Exécution</p>
    </header>

    <!-- Navigation par période -->
    <div class="period-nav">
        <button class="period-btn active" onclick="switchPeriod('Jour', this)">Journée</button>
        <button class="period-btn" onclick="switchPeriod('Semaine', this)">Semaine</button>
        <button class="period-btn" onclick="switchPeriod('Mois', this)">Mois</button>
        <button class="period-btn" onclick="switchPeriod('Annee', this)">Année</button>
        <button class="period-btn" onclick="switchPeriod('5Ans', this)">5 Ans</button>
    </div>

    <div class="container">
        
        <!-- Panneau de Statistiques -->
        <div class="stats-card">
            <div class="stats-header">
                <span>Progression de la période</span>
                <span id="stats-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Formulaire d'Ajout -->
        <div class="input-card">
            <div class="input-group">
                <input type="text" id="objective-input" class="input-field" placeholder="Nouvel objectif stratégique...">
                <button class="btn-add" onclick="addObjective()">Ajouter l'objectif</button>
            </div>
        </div>

        <!-- Recherche et Filtrage -->
        <div style="margin-bottom: 16px;">
            <input type="text" id="search-input" class="search-field" placeholder="Rechercher un objectif..." oninput="renderObjectives()">
        </div>

        <!-- Liste des Objectifs -->
        <div class="section-title">
            <span>Liste des cibles</span>
            <span id="counter-badge" style="font-size: 0.8rem; color: var(--text-muted);">0 / 0</span>
        </div>
        
        <div class="objectives-list" id="objectives-container">
            <!-- Inséré dynamiquement par JavaScript -->
        </div>

    </div>

    <!-- Barre de Navigation Inférieure -->
    <nav class="bottom-nav">
        <a href="objectifs.html" class="nav-item active">
            <span class="nav-icon">🎯</span>
            <span>Objectifs</span>
        </a>
        <a href="finances.html" class="nav-item">
            <span class="nav-icon">💰</span>
            <span>Finances</span>
        </a>
        <a href="fournisseurs.html" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>Fournisseurs</span>
        </a>
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🎨</span>
            <span>Caméléon</span>
        </a>
    </nav>

    <script>
        // Application automatique de la couleur du Caméléon enregistrée
        const savedColor = localStorage.getItem('cameleon_color') || '#4CAF50';
        const savedRgb = localStorage.getItem('cameleon_rgb') || '76, 175, 80';

        document.documentElement.style.setProperty('--primary', savedColor);
        document.documentElement.style.setProperty('--primary-glow', `rgba(${savedRgb}, 0.4)`);

        let currentPeriod = 'Jour';

        function switchPeriod(period, btnElement) {
            currentPeriod = period;
            document.getElementById('header-title').textContent = 'Objectif - ' + period;
            
            document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            renderObjectives();
        }

        function addObjective() {
            const input = document.getElementById('objective-input');
            const text = input.value.trim();
            if (!text) return;

            let storageKey = 'cameleon_objs_' + currentPeriod;
            let objectives = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            objectives.push({
                id: Date.now(),
                text: text,
                completed: false,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem(storageKey, JSON.stringify(objectives));
            input.value = '';
            renderObjectives();
        }

        function toggleObjective(id) {
            let storageKey = 'cameleon_objs_' + currentPeriod;
            let objectives = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            objectives = objectives.map(obj => {
                if (obj.id === id) {
                    obj.completed = !obj.completed;
                }
                return obj;
            });

            localStorage.setItem(storageKey, JSON.stringify(objectives));
            renderObjectives();
        }

        function deleteObjective(id) {
            let storageKey = 'cameleon_objs_' + currentPeriod;
            let objectives = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            objectives = objectives.filter(obj => obj.id !== id);
            localStorage.setItem(storageKey, JSON.stringify(objectives));
            renderObjectives();
        }

        function renderObjectives() {
            const container = document.getElementById('objectives-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const storageKey = 'cameleon_objs_' + currentPeriod;
            let objectives = JSON.parse(localStorage.getItem(storageKey) || '[]');

            // Filtrage par recherche
            const filtered = objectives.filter(o => o.text.toLowerCase().includes(searchVal));

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">Aucun objectif enregistré pour cette période.</div>`;
                updateStats(objectives);
                return;
            }

            filtered.forEach(obj => {
                const item = document.createElement('div');
                item.className = `objective-item ${obj.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="objective-content" onclick="toggleObjective(${obj.id})">
                        <div class="custom-checkbox"></div>
                        <span class="objective-text">${escapeHtml(obj.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteObjective(${obj.id})" title="Supprimer">🗑️</button>
                `;
                container.appendChild(item);
            });

            updateStats(objectives);
        }

        function updateStats(objectives) {
            const total = objectives.length;
            const completed = objectives.filter(o => o.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('stats-percentage').textContent = percentage + '%';
            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('counter-badge').textContent = `${completed} / ${total}`;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Chargement initial au démarrage
        renderObjectives();
    </script>
</body>
</html>
